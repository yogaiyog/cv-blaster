name: Build Electron App (.exe & .dmg)

on:
  workflow_dispatch: # Memungkinkan trigger manual dari tab Actions di GitHub
  push:
    branches:
      - main
      - master

jobs:
  build-windows:
    name: Build Windows (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js & Windows Installer
        run: npm run electron:build:win

      - name: Upload Windows Artifact (.exe)
        uses: actions/upload-artifact@v4
        with:
          name: CV-Blaster-Windows-Installer
          path: dist-electron/*.exe
          if-no-files-found: error

  build-mac:
    name: Build macOS (.dmg)
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js & macOS Installer
        run: npm run electron:build:mac

      - name: Upload macOS Artifact (.dmg)
        uses: actions/upload-artifact@v4
        with:
          name: CV-Blaster-macOS-Installer
          path: dist-electron/*.dmg
          if-no-files-found: error
